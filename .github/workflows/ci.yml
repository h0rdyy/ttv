name: CI

on:
  push:
    branches: [main, agent/v0.5.2-immersion-lab]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup pnpm test runner
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install
        run: npm ci

      - name: Audit production packages
        run: npm audit --omit=dev --audit-level=high

      - name: Vitest
        run: pnpm dlx vitest@4.1.10 run tests/unit

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Supabase CLI
        id: supabase_cli
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start local Supabase
        run: supabase start

      - name: Supabase database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always() && steps.supabase_cli.outcome == 'success'
        run: supabase stop --no-backup

      - name: Build
        run: npm run build

      - name: Verify generated files are stable
        run: git diff --exit-code -- package-lock.json tsconfig.json
