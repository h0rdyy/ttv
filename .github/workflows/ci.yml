name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Audit production packages
        run: npm audit --omit=dev --audit-level=high

      - name: Vitest
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.114.0

      - name: Initialize local Supabase config
        run: test -f supabase/config.toml || supabase init

      - name: Start local Supabase
        run: supabase start

      - name: Supabase database tests
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

      - name: Build
        run: npm run build

      - name: Verify generated files are stable
        run: git diff --exit-code -- package-lock.json tsconfig.json
